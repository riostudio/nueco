name: Backend checks

# No paths filter: this job is a REQUIRED status check, and a required check that
# never runs (e.g. frontend-only PRs) blocks the PR forever. The checks are cheap
# and backend-only in content, so run them on everything.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  user-scoping:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Fails when a NEW query against user-owned data is written without a tenant scope.
      # MongoDB has no row-level security, so this class of bug fails OPEN - the query returns
      # more rows, nothing errors, and no test notices. Pure stdlib (ast), so no install step.
      - name: No new unscoped queries
        working-directory: backend
        run: python3 scripts/check_user_scoping.py

      # Cheap guard against a broken deploy: every module must at least parse.
      - name: Syntax check
        working-directory: backend
        run: python3 -m compileall -q .

      # Data residency (Privacy Act 1988 / APP 11): every external-service endpoint
      # and region declaration must be env-driven and pass the AU allowlist, and no
      # hardcoded vendor endpoint may live outside core/regions.py. The tests are
      # self-contained (monkeypatched env, stdlib-only imports), so pytest is the
      # only install needed. Run the file explicitly - repo-root pytest.ini scopes
      # bare `pytest` to the eval suite, and backend/tests/ also holds legacy
      # live-API scripts that must never run in CI.
      - name: Install pytest
        run: python3 -m pip install --quiet pytest

      - name: Region residency checks
        working-directory: backend
        run: python3 -m pytest tests/test_regions.py
